<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- ★公開に踏み切るまでは検索避け。robots.txt / _headers の X-Robots-Tag と合わせて3箇所ある。
         外すときは3箇所とも外すこと（SupplyControl/CLAUDE.md 2節） -->
    <meta name="robots" content="noindex, nofollow, noarchive" />

    <title>SupplyControl｜医薬品の供給状況</title>
    <meta name="description" content="厚生労働省が公表する医療用医薬品の供給状況から、気になる薬の変化だけを受け取る。" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="app.webmanifest" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Cpath d='M16 7a6 6 0 0 0-6 6v4l-2 3v1h16v-1l-2-3v-4a6 6 0 0 0-6-6z' fill='%2360a5fa'/%3E%3Ccircle cx='16' cy='25' r='2' fill='%2360a5fa'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="top">
      <h1>SupplyControl</h1>
      <p class="asof" id="asof">読み込み中…</p>
    </header>

    <nav class="tabs" id="tabs">
      <button type="button" data-tab="watch" class="on">気になる薬</button>
      <button type="button" data-tab="search">さがす</button>
      <button type="button" data-tab="changes">今日の変化</button>
    </nav>

    <main>
      <section id="tab-watch" class="tab on">
        <p class="note" id="watch-note"></p>
        <div id="watch-list" class="list"></div>
      </section>

      <section id="tab-search" class="tab">
        <div class="searchbar">
          <input
            id="q"
            type="search"
            inputmode="search"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="品名・成分名・製造販売業者・YJコード"
            aria-label="薬を探す"
          />
        </div>

        <!-- 出荷対応でしぼる。語を入れずにここだけ押せば、いま調整中のものを一覧できる。
             区分の名前と件数は厚労省の原本のまま（こちらで「調整中」を定義し直さない） -->
        <div class="chips" id="filters" role="group" aria-label="出荷対応でしぼる">
          <button type="button" data-filter="all" class="on">すべて<span class="n"></span></button>
          <button type="button" data-filter="adjust">調整中<span class="n"></span></button>
          <button type="button" data-filter="limited">限定出荷<span class="n"></span></button>
          <button type="button" data-filter="stop">供給停止<span class="n"></span></button>
        </div>

        <p class="note" id="search-note">品名でも成分名でも引けます。ひらがな・半角でも当たります。</p>
        <div id="search-list" class="list"></div>
      </section>

      <section id="tab-changes" class="tab">
        <p class="note" id="changes-note"></p>
        <div id="changes-list" class="list"></div>
      </section>
    </main>

    <footer class="foot">
      <p>
        出典：厚生労働省「医療用医薬品の供給状況（供給状況一覧表）」を加工して作成。
        <a id="src-link" href="#" target="_blank" rel="noopener">元データを見る</a>
      </p>
      <p class="warn">
        本アプリは公表された供給状況の<strong>変化を伝えるだけ</strong>のものです。在庫の有無・代替薬・処方の変更については何も示しません。
        最終的な判断は、電子添文・各学会のガイドライン・勤務先のプロトコルに従ってください。
      </p>
      <p class="warn">気になる薬リストはこの端末の中だけに保存され、サーバーへは送信されません。</p>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
