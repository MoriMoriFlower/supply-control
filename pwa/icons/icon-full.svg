<!--
  全面塗り版。icon.svg と絵柄は同じで、角丸を付けていないだけ。

  ★角丸を自分で付けてはいけない用途があるので分けてある：
   ・apple-touch-icon … iOSが自前の角丸マスクを必ず被せる。こちらでも角丸にすると、
                        マスクの形が微妙に違うぶん角に隙間（白or黒）が出る
   ・maskable         … Androidが端末ごとの形（丸/角丸/しずく）に切り抜く。
                        余白は塗りつぶしておく必要がある

  ★maskableの安全域チェック（中心から半径 204.8 = 512×0.4 の円に収まること）：
    絵柄の最遠点は鈴の下の丸の底 (256,432) で中心から 176。204.8 に収まっている。
    絵柄を変えるときはここを再計算すること。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0f172a"/>
  <path d="M256 112a96 96 0 0 0-96 96v64l-32 48v16h256v-16l-32-48v-64a96 96 0 0 0-96-96z" fill="#60a5fa"/>
  <circle cx="256" cy="400" r="32" fill="#60a5fa"/>
</svg>
