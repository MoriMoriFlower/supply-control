name: 供給状況を取得

# 厚労省の供給状況xlsxを取りに行き、変化があれば data/ を更新してコミットする。
#
# ・重い処理（xlsxの解凍とパース）はここでやる。Cloudflare側はCPU10msしか使えないため（共通ノウハウ A-11）
# ・厚労省は最新版1本しか置かないので、ここで貯めた履歴が唯一の過去データになる（F-7）
# ・変化がない日はコミットしない＝Cloudflare Pagesのビルドも走らない

on:
  schedule:
    # UTC指定。JST 15:20 / 17:20 / 19:20 / 21:20 / 23:20 と、翌朝 08:20 の1日6回。
    #
    # ・★元ファイルの公開時刻は日によって7時間以上ずれる（実測 JST 14:18 / 16:48 / 17:11 / 19:41 / 21:31）。
    #   「毎日◯時」と決め打ちできない。だから時刻を狙わず、幅で張って回数で吸収する
    # ・★2026-08-20版は JST 21:31 公開。最終便（21:20指定）が遅延して22:14に走ったので**たまたま**拾えた。
    #   定刻に走っていたら取り逃していたので、23:20 を足した
    # ・朝08:20の1本は保険。夜のうちに全部こけても、出勤前には必ず最新になっている
    # ・★GitHubのスケジュールは指定時刻ちょうどには走らない。2026-08-17は16:10指定に対し
    #   実際の起動が16:58＝48分遅れだった。混雑時は遅延・スキップがあるので、
    #   「1回だけ」に賭けず回数で吸収する
    # ・分を0や30にしないのは、区切りのいい時刻ほどGitHub側が混むため
    # ・publicリポジトリのActionsは無料・実行時間無制限。1回17秒なので増やしても費用はかからない
    # ・変化がない日はコミットしないので、回数を増やしても履歴は汚れない
    - cron: '20 6 * * *'
    - cron: '20 8 * * *'
    - cron: '20 10 * * *'
    - cron: '20 12 * * *'
    - cron: '20 14 * * *'
    - cron: '23 23 * * *'
  workflow_dispatch: # 手動実行用

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false # 取得中に中断されると中途半端な状態でコミットしうるので止めない

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v4系はNode20実行＝2025-09に非推奨化済み。v5以降がNode24。
      # cache: npm を明示しているので、setup-node v5の「自動キャッシュ」変更の影響は受けない
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: 取得と正規化
        id: collect
        run: npm run collect

      - name: 画面用の索引を作成
        # collect が「変化なし」で早期終了した日も必ず走らせる。
        # 索引の書式を変えたときに、次の取得を待たずに作り直せるようにするため
        run: npm run index

      - name: 差分ロジックの自己テスト
        # 保存できた後に、そのデータで差分ロジックが生きているか毎回確かめる。
        # 落ちたらコミットしない（壊れた状態を履歴に残さない）
        run: npm run selftest

      - name: 変化があればコミット
        run: |
          if git diff --quiet -- data; then
            echo "data/ に変化なし。コミットしない"
            exit 0
          fi
          ASOF=$(node -p "require('./data/meta.json').source.asOf")
          N=$(node -p "require('./data/meta.json').latestChanges.total")
          M=$(node -p "require('./data/meta.json').latestChanges.notify")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "データ更新: ${ASOF}版（変化${N}件 / 通知対象${M}件）"
          git push

      # ★必ずコミットの「後ろ」に置くこと。
      #   ここで落とすのが目的（＝GitHubから失敗メールが飛ぶ）だが、
      #   コミットより前に置くと、取れたデータが履歴に残らないまま落ちてしまう。
      #
      #   鳴る条件は scripts/lib/canary.mjs を参照。
      #   要するに「新システムのAPIは動いているのに、厚労省xlsxだけ8日以上止まっている」。
      #   xlsxが廃止されると collect は「変化なし」で静かに成功し続けるので、
      #   これが無いと“通知だけが永久に来ない”状態に気付けない
      - name: カナリア（xlsxが静かに止まっていないか）
        if: steps.collect.outputs.canary_alert == '1'
        run: |
          echo "::error::新システムのAPIと食い違っている。厚労省xlsxが更新を止めた可能性がある。"
          echo "確認先: https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iryou/kouhatu-iyaku/04_00003.html"
          exit 1
