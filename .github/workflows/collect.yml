name: 供給状況を取得

# 厚労省の供給状況xlsxを取りに行き、変化があれば data/ を更新してコミットする。
#
# ・重い処理（xlsxの解凍とパース）はここでやる。Cloudflare側はCPU10msしか使えないため（共通ノウハウ A-11）
# ・厚労省は最新版1本しか置かないので、ここで貯めた履歴が唯一の過去データになる（F-7）
# ・変化がない日はコミットしない＝Cloudflare Pagesのビルドも走らない

on:
  schedule:
    # UTC指定。JST 16:10 と 20:10（元ファイルの更新はJST14時台に観測）。
    # 分を0にしないのは、毎時00分がGitHub側の混雑で遅れやすいため
    - cron: '10 7 * * *'
    - cron: '10 11 * * *'
  workflow_dispatch: # 手動実行用

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false # 取得中に中断されると中途半端な状態でコミットしうるので止めない

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v4系はNode20実行＝2025-09に非推奨化済み。v5以降がNode24。
      # cache: npm を明示しているので、setup-node v5の「自動キャッシュ」変更の影響は受けない
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: 取得と正規化
        run: npm run collect

      - name: 画面用の索引を作成
        # collect が「変化なし」で早期終了した日も必ず走らせる。
        # 索引の書式を変えたときに、次の取得を待たずに作り直せるようにするため
        run: npm run index

      - name: 差分ロジックの自己テスト
        # 保存できた後に、そのデータで差分ロジックが生きているか毎回確かめる。
        # 落ちたらコミットしない（壊れた状態を履歴に残さない）
        run: npm run selftest

      - name: 変化があればコミット
        run: |
          if git diff --quiet -- data; then
            echo "data/ に変化なし。コミットしない"
            exit 0
          fi
          ASOF=$(node -p "require('./data/meta.json').source.asOf")
          N=$(node -p "require('./data/meta.json').latestChanges.total")
          M=$(node -p "require('./data/meta.json').latestChanges.notify")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "データ更新: ${ASOF}版（変化${N}件 / 通知対象${M}件）"
          git push
